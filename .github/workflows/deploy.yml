name: Build & Deploy

on:
  push:
    branches:
      - main

env:
  IMAGE: ghcr.io/awssukhpreetsingh-ai/voice-room-backend
  CONTAINER: voice-room-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: credentials
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./wavroom_backend
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE,CONTAINER
          script: |
            # Write env file from GitHub Secrets
            cat > /home/ubuntu/$CONTAINER.env <<'ENVEOF'
            DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
            DEBUG=${{ secrets.DEBUG }}
            REDIS_HOST=${{ secrets.REDIS_HOST }}
            REDIS_PORT=${{ secrets.REDIS_PORT }}
            REDIS_DB=${{ secrets.REDIS_DB }}
            ROOM_TTL_SECONDS=${{ secrets.ROOM_TTL_SECONDS }}
            LIVEKIT_API_KEY=${{ secrets.LIVEKIT_API_KEY }}
            LIVEKIT_API_SECRET=${{ secrets.LIVEKIT_API_SECRET }}
            LIVEKIT_HOST=${{ secrets.LIVEKIT_HOST }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_STORAGE_BUCKET_NAME=${{ secrets.AWS_STORAGE_BUCKET_NAME }}
            AWS_S3_REGION_NAME=${{ secrets.AWS_S3_REGION_NAME }}
            ENVEOF
            chmod 600 /home/ubuntu/$CONTAINER.env
            echo "${{ secrets.CR_PAT }}" | docker login ghcr.io -u awssukhpreetsingh-ai --password-stdin
            docker pull $IMAGE:latest
            docker stop $CONTAINER || true
            docker rm $CONTAINER || true
            docker run -d \
              --name $CONTAINER \
              --restart unless-stopped \
              --env-file /home/ubuntu/$CONTAINER.env \
              -p 80:80 \
              $IMAGE:latest