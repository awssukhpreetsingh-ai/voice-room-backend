server {
    listen 80 default_server;
    server_name voice-api.neuro-deep.com;

    client_max_body_size 10M;

    # Logs to stdout/stderr so `docker logs` captures them
    access_log /dev/stdout;
    error_log /dev/stderr;

    # Serve static files directly from disk (faster than Gunicorn)
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Media files (user uploads) — keep if you serve uploads from the container
    location /media/ {
        alias /app/media/;
    }

    # Health check — no logging, fast response
    location = /health/ {
        proxy_pass http://127.0.0.1:8080;
        access_log off;
    }

    # Everything else → Gunicorn
    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }
}